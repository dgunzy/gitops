apiVersion: v1
kind: Service
metadata:
  labels:
    helm.sh/chart: plugin-barman-cloud-0.7.0
    app.kubernetes.io/name: plugin-barman-cloud
    app.kubernetes.io/instance: barman-cloud
    app.kubernetes.io/version: "v0.13.0"
