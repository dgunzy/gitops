apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CloudNativePG operator (controller, RBAC, webhooks, services) rendered from the
# Helm chart. Applied by the `cnpg-operator` Flux Kustomization, which dependsOn
# `cnpg-crds`. Namespace is created here.
resources:
  - namespace.yaml
  - cnpg-operator.yaml
