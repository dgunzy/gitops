apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 5m
  chart:
    spec:
      chart: external-secrets
      # ESO re-versioned 0.20.x -> 2.x. Resources here use external-secrets.io/v1 (served by 2.x).
      # Pinned to the 2.6 minor (auto-patches); installCRDs/replica values below remain valid.
      version: "2.6.x"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  install:
    createNamespace: true
    remediation:
      retries: 3
  values:
    installCRDs: true
    replicaCount: 1
    webhook:
      replicaCount: 1
    certController:
      replicaCount: 1
