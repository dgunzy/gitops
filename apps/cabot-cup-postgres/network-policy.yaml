# Additive to the shared cluster's existing ingress policy: only namespaces
# explicitly opted into Cabot database access may reach PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabot-cup-postgres-allow
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: masters-pool-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              db.cabot-cup/access: "true"
      ports:
        - protocol: TCP
          port: 5432
