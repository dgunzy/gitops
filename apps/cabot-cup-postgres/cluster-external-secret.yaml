# Opted-in Cabot namespaces receive only the application connection URL. The
# value must target cabot_cup through masters-pool-postgres-rw.databases:5432.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cabot-cup-db
spec:
  externalSecretName: cabot-cup-db
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        db.cabot-cup/access: "true"
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    target:
      name: cabot-cup-db
      creationPolicy: Owner
    data:
      - secretKey: DATABASE_URL
        remoteRef:
          key: k0s/cabot-cup/postgres
          property: DATABASE_URL
