# Defense-in-depth: restrict ingress to the Postgres pods. External access is already
# impossible (ClusterIP services only); this limits in-cluster reachability to opted-in
# namespaces, the CNPG operator/plugin, and the cluster's own pods (replication/sidecar).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masters-pool-postgres-allow
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: masters-pool-postgres
  policyTypes:
    - Ingress
  ingress:
    # Opted-in application namespaces -> Postgres wire protocol only.
    - from:
        - namespaceSelector:
            matchLabels:
              db.masters-pool/access: "true"
      ports:
        - protocol: TCP
          port: 5432
    # Unified Cabot application namespace -> Postgres wire protocol only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cabot-cup-next
      ports:
        - protocol: TCP
          port: 5432
    # Versioned Cabot migration Jobs run in this namespace. Keep both selectors
    # explicit so the namespace boundary remains visible and reviewable.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cabot-cup
              app.kubernetes.io/component: database-migration
      ports:
        - protocol: TCP
          port: 5432
    # CNPG operator + Barman Cloud plugin (status, backup coordination).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Same cluster pods (replicas, jobs, plugin sidecar).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: masters-pool-postgres
