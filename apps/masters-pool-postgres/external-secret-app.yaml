# Postgres app-role credentials (kubernetes.io/basic-auth) consumed by CNPG initdb.
# Single source of truth in AWS Secrets Manager: k0s/masters-pool/postgres
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: masters-pool-postgres-app
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: masters-pool-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: k0s/masters-pool/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: k0s/masters-pool/postgres
        property: password
