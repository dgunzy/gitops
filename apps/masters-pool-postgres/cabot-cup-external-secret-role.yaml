# Password for the least-privileged CNPG-managed Cabot login. It is reconciled
# with the shared cluster so Flux cannot wait on a role secret scheduled later.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cabot-cup-postgres-role
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cabot-cup-postgres-role
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: cabot_cup
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: k0s/cabot-cup/postgres
        property: password
