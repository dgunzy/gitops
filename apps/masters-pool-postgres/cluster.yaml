# CloudNativePG cluster for the golf_pool (Go) backend.
# In-cluster only: CNPG creates ClusterIP services (-rw/-ro/-r) — no LoadBalancer/HTTPRoute.
# Backups via the Barman Cloud plugin (isWALArchiver) -> ObjectStore masters-pool-postgres-backup.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: masters-pool-postgres
  namespace: databases
spec:
  instances: 1

  # The Cabot application owns a separate database and login on this shared
  # PostgreSQL cluster. The password Secret is reconciled by
  # this shared database foundation; this role has no cluster administration privileges.
  managed:
    roles:
      - name: cabot_cup
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: 20
        passwordSecret:
          name: cabot-cup-postgres-role

  storage:
    storageClass: local-path
    size: 10Gi

  bootstrap:
    initdb:
      database: golf_pool
      owner: golf_pool
      secret:
        name: masters-pool-postgres-app

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: masters-pool-postgres-backup
