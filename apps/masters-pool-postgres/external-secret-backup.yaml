# S3 credentials for the Barman Cloud plugin (scoped IAM user cnpg-backup).
# Source: k0s/masters-pool/postgres-backup -> keys ACCESS_KEY_ID / SECRET_ACCESS_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: masters-pool-postgres-backup-creds
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: masters-pool-postgres-backup-creds
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k0s/masters-pool/postgres-backup
