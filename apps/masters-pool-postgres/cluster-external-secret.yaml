# Distributes the app DATABASE_URL to ANY namespace labelled  db.masters-pool/access: "true".
# A consuming app just adds that label to its namespace and reads Secret `masters-pool-db`
# (key DATABASE_URL). ESO creates/owns an ExternalSecret + Secret in each matching namespace.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: masters-pool-db
spec:
  externalSecretName: masters-pool-db
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        db.masters-pool/access: "true"
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    target:
      name: masters-pool-db
      creationPolicy: Owner
    data:
      - secretKey: DATABASE_URL
        remoteRef:
          key: k0s/masters-pool/postgres
          property: DATABASE_URL
