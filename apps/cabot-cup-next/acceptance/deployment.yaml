apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabot-cup-test
  labels:
    app.kubernetes.io/name: cabot-cup-test
    app.kubernetes.io/component: web
    app.kubernetes.io/environment: acceptance
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup-test
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabot-cup-test
        app.kubernetes.io/component: web
        app.kubernetes.io/environment: acceptance
    spec:
      serviceAccountName: cabot-cup-test
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cabot-cup
          image: ghcr.io/dgunzy/cabot-cup:20260725T215054Z-sha-647cd12@sha256:4bb0ed5facea22a603be9ae6dbdb65080bf9b3271433c2b73ea05b0f153b690e # {"$imagepolicy": "flux-system:cabot-cup"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cabot-cup-test-config
            - secretRef:
                name: cabot-cup-test-env
            - secretRef:
                name: cabot-cup-test-db
          # The process retries an unreachable database for up to
          # DATABASE_CONNECT_TIMEOUT (30s) before serving. A startup probe gives
          # it that room and holds the liveness probe off until it succeeds, so
          # a slow start cannot be killed mid-retry. 20 x 2s = 40s of grace.
          startupProbe:
            httpGet:
              path: /livez
              port: web
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
