apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cabot-cup-test
resources:
  - service-account.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - network-policy.yaml
configMapGenerator:
  - name: cabot-cup-test-config
    literals:
      - APP_ENV=staging
      - PORT=8080
      - PUBLIC_BASE_URL=https://test.cabotcup.ca
      - PRIVATE_APP_ENABLED=true
      - DATABASE_MODE=test
      - OIDC_REDIRECT_URL=https://test.cabotcup.ca/auth/callback
      - SESSION_TTL=12h
      - LOGIN_ATTEMPT_TTL=10m
      - WAGER_AUTO_APPROVE_MAX_CENTS=20000
      # Credit limit (in cents) for a newly invited member. See go-book/docs/CONFIGURATION.md.
      - DEFAULT_CREDIT_LIMIT_CENTS=150000
      # Default dynamic-pricing liquidity ("b", in cents). See go-book/docs/CONFIGURATION.md.
      - PRICING_LIQUIDITY_DEFAULT_CENTS=500000
