apiVersion: batch/v1
kind: Job
metadata:
  name: cabot-cup-test-migrate-000001
  labels:
    app.kubernetes.io/name: cabot-cup-test
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/environment: acceptance
    app.kubernetes.io/version: "000001"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabot-cup-test
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/environment: acceptance
        app.kubernetes.io/version: "000001"
    spec:
      restartPolicy: Never
      serviceAccountName: cabot-cup-test-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-network-policy
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command:
            - /bin/sh
            - -c
            - sleep 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              cpu: 10m
              memory: 4Mi
      containers:
        - name: migrate
          image: ghcr.io/dgunzy/cabot-cup:20260728T125949Z-sha-f23ff81@sha256:e5c16300f791317fcbca16ff7fb847689fec84efe7b8d8f6a958fbb1a4198cbd # {"$imagepolicy": "flux-system:cabot-cup"}
          imagePullPolicy: Always
          args:
            - migrate
          env:
            - name: APP_ENV
              value: staging
            - name: DATABASE_MODE
              value: test
          envFrom:
            - secretRef:
                name: cabot-cup-test-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
