# OIDC, session, and S3 signing credentials. Keep DATABASE_URL in the separately
# owned cabot-cup-db Secret distributed by the database foundation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cabot-cup-next-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cabot-cup-next-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k0s/cabot-cup/app
