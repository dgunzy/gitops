apiVersion: batch/v1
kind: Job
metadata:
  name: cabot-cup-migrate-000001
  labels:
    app.kubernetes.io/name: cabot-cup
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/version: "000001"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        cabotcup.ca/migration-attempt: "000001-databases-3"
      labels:
        app.kubernetes.io/name: cabot-cup
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/version: "000001"
    spec:
      restartPolicy: Never
      serviceAccountName: cabot-cup-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/dgunzy/cabot-cup:20260725T002217Z-sha-defff05@sha256:f7b9a44a9062658c15b9834d067374e9f2f9542ffde4360cc72b6277922f3b66 # {"$imagepolicy": "flux-system:cabot-cup"}
          imagePullPolicy: Always
          args:
            - migrate
          envFrom:
            - secretRef:
                name: cabot-cup-migrate-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      initContainers:
        - name: wait-for-network-policy
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command:
            - /bin/sh
            - -c
            - sleep 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              cpu: 10m
              memory: 4Mi
