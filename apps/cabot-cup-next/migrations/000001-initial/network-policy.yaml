apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabot-cup-migrate-000001
  labels:
    app.kubernetes.io/name: cabot-cup
    app.kubernetes.io/component: database-migration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup
      app.kubernetes.io/component: database-migration
      app.kubernetes.io/version: "000001"
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-router evaluates Service traffic at different translation stages. Limit
    # by PostgreSQL port here; CNPG ingress requires this Job's exact pod labels.
    - ports:
        - protocol: TCP
          port: 5432
