apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabot-cup-migrate-000001
  labels:
    app.kubernetes.io/name: cabot-cup
    app.kubernetes.io/component: database-migration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup
      app.kubernetes.io/component: database-migration
      app.kubernetes.io/version: "000001"
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        # kube-router evaluates egress before Service DNAT, so target the stable
        # read-write Service VIP. Database ingress still requires the Cabot label.
        - ipBlock:
            cidr: 10.98.237.91/32
      ports:
        - protocol: TCP
          port: 5432
