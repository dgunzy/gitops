apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabot-cup-next
  labels:
    app.kubernetes.io/name: cabot-cup
    app.kubernetes.io/component: web
spec:
  # Public production replica. The migration Flux Kustomization gates rollout.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabot-cup
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: cabot-cup-next
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cabot-cup
          image: ghcr.io/dgunzy/cabot-cup:20260720T101735Z-sha-bae3fdf@sha256:45e1a1230531c706a20eaa91ccb5a52240ada8c90967d3a24e41a287bb712468 # {"$imagepolicy": "flux-system:cabot-cup"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cabot-cup-next-config
            - secretRef:
                name: cabot-cup-next-env
            - secretRef:
                name: cabot-cup-db
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
