apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabot-cup-next
  labels:
    app.kubernetes.io/name: cabot-cup
    app.kubernetes.io/component: web
spec:
  # Public production replica. The migration Flux Kustomization gates rollout.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabot-cup
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: cabot-cup-next
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cabot-cup
          image: ghcr.io/dgunzy/cabot-cup:20260727T020830Z-sha-f81c1ad@sha256:435487df7b15dd5861302db2baf8babbd542ffed2ddd5074965fa9bca8663fe7 # {"$imagepolicy": "flux-system:cabot-cup"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cabot-cup-next-config
            - secretRef:
                name: cabot-cup-next-env
            - secretRef:
                name: cabot-cup-db
          # The process retries an unreachable database for up to
          # DATABASE_CONNECT_TIMEOUT (30s) before serving. A startup probe gives
          # it that room and holds the liveness probe off until it succeeds, so
          # a slow start cannot be killed mid-retry. 20 x 2s = 40s of grace.
          startupProbe:
            httpGet:
              path: /livez
              port: web
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
