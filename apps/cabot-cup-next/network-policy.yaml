apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabot-cup-next
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Reserved for future authenticated database handlers. kube-router currently
    # blocks this cross-namespace selector, so public-only pods cannot reach CNPG.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: masters-pool-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Google OIDC, AWS APIs/S3, and other configured HTTPS dependencies.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
