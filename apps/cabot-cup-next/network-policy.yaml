apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabot-cup-next
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cabot-cup
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Cabot's database on the shared CNPG cluster.
    - to:
        # kube-router evaluates egress before Service DNAT, so target the stable
        # read-write Service VIP. Database ingress still requires the Cabot label.
        - ipBlock:
            cidr: 10.98.237.91/32
      ports:
        - protocol: TCP
          port: 5432
    # Google OIDC, AWS APIs/S3, and other configured HTTPS dependencies.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
