apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cabot-cup-next
resources:
  - namespace.yaml
  - service-account.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - network-policy.yaml
configMapGenerator:
  # The content hash rolls the Deployment when non-secret runtime config changes.
  - name: cabot-cup-next-config
    literals:
      - APP_ENV=production
      - PORT=8080
      - PUBLIC_BASE_URL=https://cabotcup.ca
      # Enabled in a second cutover commit after schema v2 and legacy promotion.
      - PRIVATE_APP_ENABLED=false
      - SESSION_TTL=12h
      - LOGIN_ATTEMPT_TTL=10m
