apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cabot-cup-next
resources:
  - namespace.yaml
  - service-account.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - network-policy.yaml
configMapGenerator:
  # The content hash rolls the Deployment when non-secret runtime config changes.
  - name: cabot-cup-next-config
    literals:
      - APP_ENV=production
      - PORT=8080
      - PUBLIC_BASE_URL=https://cabotcup.ca
      # Enables /login, /book, and /admin plus the in-process outbox
      # dispatcher. Membership is invitation/approval-gated and the ledger
      # starts empty, so exposure is login-only until the bootstrapped owner
      # invites members. Reverting to false is a clean rollback.
      - PRIVATE_APP_ENABLED=true
      # real|test: test flips the app onto TEST_DATABASE_URL (cabot_cup_test).
      # The app refuses test mode while APP_ENV=production.
      - DATABASE_MODE=real
      - SESSION_TTL=12h
      - LOGIN_ATTEMPT_TTL=10m
      # Wagers up to this stake (in cents) are auto-approved on placement;
      # larger ones wait for manual admin approval. Default here is $100.
      - WAGER_AUTO_APPROVE_MAX_CENTS=10000
