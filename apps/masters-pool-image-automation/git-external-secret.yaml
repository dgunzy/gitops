# SSH deploy key (read/write) for image-automation push-back to dgunzy/gitops.
# Sourced from AWS Secrets Manager: k0s/flux/image-automation-ssh
# JSON keys identity / identity.pub / known_hosts map to the format Flux git SSH auth expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-automation-git-auth
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: image-automation-git-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k0s/flux/image-automation-ssh
