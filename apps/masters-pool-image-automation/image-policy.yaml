apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: masters-pool
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: masters-pool
  # Select time-sortable immutable tags produced by CI, e.g. 20260420T153012Z-sha-abc1234
  # and order by the leading UTC timestamp so "newest build" is unambiguous.
  filterTags:
    pattern: '^(?P<ts>[0-9]{8}T[0-9]{6}Z)-sha-[0-9a-f]+$'
    extract: '$ts'
  digestReflectionPolicy: Always
  interval: 5m
  policy:
    numerical:
      order: asc
