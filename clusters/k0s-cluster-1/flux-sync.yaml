# Kustomization for platform controllers (CRDs and operators)
# Note: GitRepository is bootstrapped by FluxInstance sync section.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/k0s-cluster-1/platform/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
# Kustomization for platform configs (depends on controllers)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-configs
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: platform-controllers
  path: ./clusters/k0s-cluster-1/platform/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# Kustomization for applications
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  dependsOn:
    - name: platform-configs
  path: ./clusters/k0s-cluster-1/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# ── CloudNativePG: CRDs first, then operator (vendored helm template) ──────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./platform/controllers/cloudnative-pg/1.29.1/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cnpg-crds
  path: ./platform/controllers/cloudnative-pg/1.29.1/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cnpg-cloudnative-pg
      namespace: cnpg-system
---
# ── Barman Cloud plugin (modern backup method): CRD first, then plugin ─────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-plugin-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./platform/controllers/barman-cloud-plugin/v0.13.0/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-plugin
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: barman-plugin-crds
    - name: cnpg-operator        # plugin lives in cnpg-system + registers with the operator
    - name: platform-controllers # needs cert-manager for operator<->plugin mTLS
  path: ./platform/controllers/barman-cloud-plugin/v0.13.0/plugin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: barman-cloud-plugin-barman-cloud
      namespace: cnpg-system
---
# ── Postgres instance for golf_pool (Cluster + ObjectStore + secrets) ──────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: masters-pool-postgres
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  dependsOn:
    - name: cnpg-operator
    - name: barman-plugin
  path: ./apps/masters-pool-postgres
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: masters-pool-postgres
      namespace: databases
---
# Cabot database and isolated role on the shared CNPG cluster. This remains a
# separate reconciliation boundary so application rollout cannot race DB setup.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cabot-cup-postgres
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  dependsOn:
    - name: masters-pool-postgres
  path: ./clusters/k0s-cluster-1/apps/cabot-cup-postgres
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  # CNPG Database reports status.applied rather than a Ready condition, so use
  # an explicit health expression before releasing the dependent app.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      inProgress: >-
        !has(status.observedGeneration) ||
        status.observedGeneration != metadata.generation ||
        !has(status.applied) || !status.applied
      failed: "false"
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.applied) && status.applied
---
# Versioned schema migration gate. Force replacement is required because Job pod
# templates are immutable when image automation advances the Cabot image.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cabot-cup-migrate
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  dependsOn:
    - name: cabot-cup-postgres
  path: ./clusters/k0s-cluster-1/apps/cabot-cup-migrate
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: cabot-cup-migrate-000001
      namespace: databases
---
# Public unified Cabot application. The migration Kustomization must complete
# successfully before Flux reconciles the application and cabotcup.ca route.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cabot-cup-next
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  dependsOn:
    - name: cabot-cup-migrate
  path: ./clusters/k0s-cluster-1/apps/cabot-cup-next
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# Isolated acceptance schema gate. Both the CLI and its eventual web process
# select TEST_DATABASE_URL and are rejected if it aliases the real database.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cabot-cup-test-migrate
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  dependsOn:
    - name: cabot-cup-postgres
  path: ./clusters/k0s-cluster-1/apps/cabot-cup-test-migrate
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: cabot-cup-test-migrate-000001
      namespace: cabot-cup-test
---
# Browser-accessible acceptance instance. It cannot release until the isolated
# schema gate and the Gateway/certificate platform configuration are healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cabot-cup-test
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  dependsOn:
    - name: cabot-cup-test-migrate
    - name: platform-configs
  path: ./clusters/k0s-cluster-1/apps/cabot-cup-test
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
